{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Console &mdash; {{ vm.name }} &mdash; Palisade</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.min.css" />
  <style>
    /* Reset — do NOT load style.css/organizer.css here; their * { font-family: sans-serif }
       overrides xterm.js's measurement span and breaks character-cell width calculation. */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; background: #1a1a1a; }

    /* Ensure xterm's measurement span and canvas always use a monospace font,
       no matter what any ancestor rule says. */
    #terminal-wrap, #terminal-wrap * {
      font-family: Consolas, Menlo, Monaco, 'Liberation Mono', 'Courier New', monospace !important;
    }

    /* Header + status are fixed so #terminal-wrap can be positioned absolutely below them */
    .console-header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 10;
      background: #e21833;
      color: #fff;
      padding: 10px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .console-header h2   { color: #fff; font-size: 16px; margin: 0; }
    .console-meta        { font-size: 12px; color: rgba(255,255,255,.75); margin-top: 2px; }
    .console-header-actions { display: flex; gap: 8px; align-items: center; }


    /* Terminal fills exactly the remaining space — measured by JS below */
    #terminal-wrap {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      /* top is set by JS once we measure header + status heights */
      overflow: hidden;
    }
    /* xterm.js sizes its own canvas; do NOT set height/width here */
    #terminal { width: 100%; height: 100%; }

    .org-button {
      display: inline-block;
      background: #e21833;
      color: #fff !important;
      padding: 5px 12px;
      border-radius: 3px;
      border: none;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      font-size: 12px;
      font-family: inherit;
    }
    .org-button:hover { background: #a01226; }
    .console-header .org-button-secondary {
      background: transparent;
      color: #fff !important;
      border: 1px solid rgba(255,255,255,.5);
    }
    .console-header .org-button-secondary:hover { background: rgba(255,255,255,.15); }
  </style>
</head>
<body>

<div class="console-header">
  <div>
    <h2>{{ vm.name }}</h2>
    <div class="console-meta">
      VMID {{ vm.vmid }} &nbsp;&mdash;&nbsp; {{ vm.machine_template.name }}
      &nbsp;&mdash;&nbsp; Team: {{ vm.team.name }}
    </div>
  </div>
  <div class="console-header-actions">
    <span style="font-size:11px;color:rgba(255,255,255,.5);margin-right:4px;">
      Press <kbd style="background:rgba(255,255,255,.15);padding:1px 5px;border-radius:3px;">Ctrl+O</kbd> to detach
    </span>
    <button class="org-button org-button-secondary" onclick="reconnect()">Reconnect</button>
    <button class="org-button org-button-secondary" onclick="window.close()">Close</button>
  </div>
</div>


<div id="terminal-wrap">
  <div id="terminal"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.min.js"></script>
<script>
// ── Layout ────────────────────────────────────────────────────────────────────
function layoutTerminal() {
  const headerH = document.querySelector('.console-header').offsetHeight;
  document.getElementById('terminal-wrap').style.top = headerH + 'px';
}

// ── xterm.js ─────────────────────────────────────────────────────────────────
const term = new Terminal({
  cursorBlink: true,
  scrollback: 5000,
  fontFamily: "'Courier New', Courier, monospace",
  fontSize: 14,
  lineHeight: 1.0,
  letterSpacing: 0,
  theme: {
    background: '#1a1a1a',
    foreground: '#e8e8e8',
    cursor:     '#ffd200',
    selectionBackground: 'rgba(255,210,0,.25)',
  },
});

const fitAddon = new FitAddon.FitAddon();
term.loadAddon(fitAddon);

// Double-rAF ensures fixed-position layout has fully committed before we
// measure offsetHeight and open the terminal.
requestAnimationFrame(() => requestAnimationFrame(() => {
  layoutTerminal();
  term.open(document.getElementById('terminal'));
  fitAddon.fit();
  connect('{{ ws_token }}');
}));

// Send resize to server whenever xterm.js recalculates cols/rows
term.onResize(({cols, rows}) => sendResize(cols, rows));

window.addEventListener('resize', () => { layoutTerminal(); fitAddon.fit(); });


// ── WebSocket ────────────────────────────────────────────────────────────────
let ws = null;

function sendResize(cols, rows) {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({type: 'resize', cols, rows}));
  }
}

function connect(token) {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(proto + '://' + location.host + '/ws/console/?token=' + token);
  ws.binaryType = 'arraybuffer';

  ws.onopen = () => {
    sendResize(term.cols, term.rows);
  };

  ws.onmessage = (e) => {
    if (e.data instanceof ArrayBuffer) {
      term.write(new Uint8Array(e.data));
    } else {
      term.write(e.data);
    }
  };

  ws.onclose = (e) => {
    if (e.code === 1006) {
      term.write('\r\n\x1b[33m\u26a0 WebSocket refused (1006) \u2014 start uvicorn, not runserver.\x1b[0m\r\n');
    } else if (e.code === 4001) {
      term.write('\r\n\x1b[33m\u26a0 Session expired \u2014 click Reconnect.\x1b[0m\r\n');
    } else if (e.code >= 4000) {
      term.write('\r\n\x1b[33m\u26a0 Console error (' + e.code + ') \u2014 click Reconnect.\x1b[0m\r\n');
    } else if (e.code !== 1000) {
      term.write('\r\n\x1b[33m\u26a0 Disconnected \u2014 click Reconnect.\x1b[0m\r\n');
    }
  };

  ws.onerror = () => {};

  // Send keyboard input as binary so the server can distinguish it from
  // JSON control messages (which are sent as text).
  term.onData((data) => {
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(new TextEncoder().encode(data).buffer);
    }
  });
}

function reconnect() {
  if (ws) { ws.close(); ws = null; }
  window.location.reload();
}
</script>

</body>
</html>
