<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Organizer{% endblock %} — Palisade</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'style.css' %}" />
    <link rel="stylesheet" href="{% static 'organizer.css' %}" />
  </head>
  <body>
    <nav>
      <ul class="navbar">
        <div>
          <li><a href="{% url 'organizer:competition_list' %}">COMPETITIONS</a></li>
          <li><a href="{% url 'organizer:template_list' %}">TEMPLATES</a></li>
        </div>
        <div>
          <li><a href="{% url 'logout' %}">LOGOUT</a></li>
        </div>
      </ul>
    </nav>

    <div class="org-feed">
      {% block content %}{% endblock %}
    </div>

    <div id="org-modal-backdrop">
      <div id="org-modal">
        <p id="org-modal-msg"></p>
        <div class="org-modal-actions">
          <button id="org-modal-cancel" class="org-button org-button-secondary">Cancel</button>
          <button id="org-modal-ok" class="org-button">Confirm</button>
        </div>
      </div>
    </div>

    <script>
    // Modal confirm — replaces browser alert/confirm dialogs
    (function () {
      const backdrop = document.getElementById('org-modal-backdrop');
      const msg      = document.getElementById('org-modal-msg');
      const okBtn    = document.getElementById('org-modal-ok');
      const cancelBtn= document.getElementById('org-modal-cancel');
      let _form = null;

      function show(text, form) {
        _form = form;
        msg.textContent = text;
        backdrop.classList.add('org-modal-visible');
      }
      function hide() {
        backdrop.classList.remove('org-modal-visible');
        _form = null;
      }

      okBtn.onclick = () => {
        backdrop.classList.remove('org-modal-visible');
        if (_form) {
          _form.dataset.confirmed = '1';
          _form.requestSubmit();
          _form = null;
        }
      };
      cancelBtn.onclick = hide;
      backdrop.onclick = (e) => { if (e.target === backdrop) hide(); };

      document.addEventListener('submit', (e) => {
        const form = e.target;
        if (form.dataset.confirm && !form.dataset.confirmed) {
          e.preventDefault();
          show(form.dataset.confirm, form);
        }
      });
    })();

    class Toast {
      constructor(pos = 'br', maxStack = 3) {
        this.maxStack = maxStack;
        this.container = document.querySelector(`.toast-container[data-position="${pos}"]`);
        if (!this.container) {
          this.container = document.createElement('div');
          this.container.className = 'toast-container';
          this.container.dataset.position = pos;
          document.body.appendChild(this.container);
        }
      }
      show(type, title, msg, duration = 5000) {
        const active = this.container.querySelectorAll('.toast');
        if (active.length >= this.maxStack) active[0].remove();
        const t = document.createElement('div');
        t.className = `toast style-solid toast-${type}`;
        t.innerHTML = `
          <div class="toast-icon">${this._icon(type)}</div>
          <div class="toast-content"><b>${title}</b><div>${msg}</div></div>
          <button class="toast-close">&times;</button>
          <div class="toast-progress"></div>`;
        t.style.animation = 'slideInRight 0.4s forwards';
        this.container.appendChild(t);
        const bar = t.querySelector('.toast-progress');
        const dismiss = () => {
          t.style.animation = 'slideOutRight 0.3s forwards';
          t.addEventListener('animationend', () => t.remove(), { once: true });
        };
        let timerId = null;
        let remaining = duration;
        let startedAt = null;
        const run = () => {
          startedAt = Date.now();
          bar.style.transition = `transform ${remaining}ms linear`;
          bar.style.transform = 'scaleX(0)';
          timerId = setTimeout(dismiss, remaining);
        };
        t.addEventListener('mouseenter', () => {
          if (!timerId) return;
          clearTimeout(timerId);
          timerId = null;
          remaining -= Date.now() - startedAt;
          const scale = new DOMMatrix(getComputedStyle(bar).transform).m11;
          bar.style.transition = 'none';
          bar.style.transform = `scaleX(${scale})`;
        });
        t.addEventListener('mouseleave', () => { run(); });
        t.querySelector('.toast-close').onclick = dismiss;
        setTimeout(run, 50);
      }
      _icon(type) {
        return {
          success: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
          error:   '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></svg>',
          warning: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>',
          info:    '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>',
        }[type] || '';
      }
    }

    const toast = new Toast('br');

    {% for message in messages %}
    toast.show(
      '{{ message.tags|default:"info" }}',
      '{{ message.tags|capfirst|default:"Info" }}',
      '{{ message|escapejs }}'
    );
    {% endfor %}
    </script>
  </body>
</html>
